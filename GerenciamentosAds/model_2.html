<script>
    window.googletag = window.googletag || { cmd: [] };
  
    var anchor_slot;
    var REFRESH_KEY = 'refresh';
    var REFRESH_VALUE = 'true';

    googletag.cmd.push(function () {
        //Size mapping
        var mapping_leaderboard_top = googletag.sizeMapping()
            .addSize([0, 0], [[320, 50], [320, 100]])
            .addSize([980, 200], [[970, 250], [728, 90]])
            .build();

        googletag.defineSlot('AdUnit', [[728, 90]], 'header_home')
            .defineSizeMapping(mapping_leaderboard_top)
            .setTargeting(REFRESH_KEY, REFRESH_VALUE)
            .setTargeting('refreshed_slot', 'false')
            .addService(googletag.pubads());

        anchor_slot = googletag.defineOutOfPageSlot('AdUnit', googletag.enums.OutOfPageFormat.BOTTOM_ANCHOR);

        if(anchor_slot){
            anchor_slot.setTargeting(REFRESH_KEY, REFRESH_VALUE).setTargeting('refreshed_slot', 'false').addService(googletag.pubads());
        } else {
            console.log("Anchor not loaded");
        }

        var SECONDS_TO_WAIT_AFTER_VIEWABILITY = 30;
        googletag.pubads().addEventListener('impressionViewable', function (event) {
            var slot = event.slot;
            if(slot.getTargeting(REFRESH_KEY).indexOf(REFRESH_VALUE) > -1) {
                slot.setTargeting('refreshed_slot', 'true');
                setTimeout(function () {
                    googletag.pubads().refresh([slot]);
                }, SECONDS_TO_WAIT_AFTER_VIEWABILITY * 1000);
            }
        });

        googletag.pubads().enableLazyLoad({
            fetchMarginPercent: 100,
            renderMarginPercent: 100,
            mobileScaling: 2.0
        });

        googletag.pubads().set('page_url', '');
        googletag.pubads().setTargeting('gamGtm', 'true');
        googletag.pubads().setCentering(true);
        googletag.enableServices();

        googletag.display(anchor_slot);
    });

    function appendAd(adUnitID) {
        var existingDiv = document.getElementById(adUnitID);
        
        if (existingDiv) {
            googletag.cmd.push(function () {
                googletag.display(adUnitID);
            });
        }
    }

    appendAd('header_home');
</script>
